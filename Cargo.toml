[workspace]
members = [
  "crates/core",
  "crates/local-endpoint",
  "crates/persistence",
  "crates/scheduler",
  "crates/cli",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Kaven File Copy contributors"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cron = "0.15"
ctrlc = "3"
filetime = "0.2"
globset = "0.4"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

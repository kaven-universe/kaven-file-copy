[package]
name = "kaven-file-copy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "kaven_file_copy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
kfc-core = { path = "../../../crates/core" }
kfc-local-endpoint = { path = "../../../crates/local-endpoint" }
kfc-persistence = { path = "../../../crates/persistence" }
kfc-scheduler = { path = "../../../crates/scheduler" }
notify.workspace = true
open = "5"
reqwest = { version = "=0.13.5", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.7", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "=2.14.1"
uuid.workspace = true
walkdir.workspace = true

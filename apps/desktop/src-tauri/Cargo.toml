[package]
name = "kaven-file-copy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kaven_file_copy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
kfc-core = { path = "../../../crates/core" }
kfc-local-endpoint = { path = "../../../crates/local-endpoint" }
kfc-persistence = { path = "../../../crates/persistence" }
kfc-scheduler = { path = "../../../crates/scheduler" }
notify.workspace = true
open = "5"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
uuid.workspace = true
walkdir.workspace = true
